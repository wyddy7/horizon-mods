id = "spider_man"
kind = "native-mod"
name = "Spider-Man"
summary = "Web swinging, zips, wall running and parkour, tuned against the console games' feel."
description = """
Swing through a city on webs. Hold **R** and jump: a web catches the nearest anchor ahead and you swing on it, let go
to fly on, catch the next one.

**Controls** (change them in Controls):
- **R**: hold to swing; on the ground, a parkour run, faster with **W**; on a wall, a wall run
- **Z**: hold to zip to where you look
- **Space** on a web: pump for speed; let go to jump off
- **A / D** while swinging: lean to the side
- **F5**: third person, where the poses, the web lines and the chase camera show

**Settings** (Options > Mods > Spider-Man > Config): how long a web flies before it bites. `/swingmode on|off|delay|view|debug`
in chat does the same and more.

Works in your own worlds: single player, or a LAN world you host. On other servers it stays off.

What it changes in the game: the player's velocity and fall while swinging (own world only), the third-person camera
and player pose, web lines drawn in the world, and the view's turn while running on a wall. It reads no files outside
its settings and sends nothing over the network.

**Back catpack** (single player for now): a backpack that carries your own tamed cat, worn in a back slot; **G**
opens it, **Shift+G** takes it off.

**What it sends and keeps.** Only in your own world (single player, or a LAN world you host): on anyone else's
server, and for a guest of a LAN world, the mod sends nothing and changes nothing.
- Two payload channels of the cat backpack, `spider_man:catpack_state` (server to your own player only: what your
  back slot holds, and the bag's storage window) and `spider_man:catpack_ask` (your game to its own server, heard
  only from you: bag actions that name slots, checked by the server). Their identifiers are advertised during
  connection setup, as every registered channel is; bag contents and actions travel only on the integrated
  connection, checked at every send and receipt, and stop the moment it ends. Nothing leaves the computer.
- While a web holds, the movement packet to your own world's server says you are on the ground, so no fall builds
  up.
- No chat lines or commands sent for you, no sockets, no HTTP, no telemetry.
- Files: only its settings in `mod-storage/spider-man/`; the bag on your back is kept in your player data, a bag's
  cat and items in the bag item.

Fan-made, not affiliated with Marvel, Sony or Insomniac Games."""
authors = ["wyddy7"]
owners = ["wyddy7"]
owner_ids = [172210694]
