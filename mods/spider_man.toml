changelog = "Back catpack: a backpack that carries your own tamed cat, worn in a back slot (G opens it, 27 slots; single player only, on both sides). A bag keeps only the cat's own fields and releases a plain cat for its owner; item models are bag-only. Long flights go up to 30 % faster after 3 s in the air (setting 0 to 200 %), a speedometer behind /swingmode speedo, a camera distance slider and a settings reset. Pinned to Horizon's Nightly of 2026-11-18 (0b14f8a) and horizon-mixins e59da90. Catpack messages only on the integrated connection, checked at each message. Release v0.2.8 of the repository."

